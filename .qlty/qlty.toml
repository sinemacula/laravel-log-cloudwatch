# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Lint and
# format rules come from the shared sinemacula/coding-standards source; this
# file wires that source in and selects the plugins relevant to a PHP
# repository.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[runtimes.enabled]
php = "8.3"

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.24.1"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
version = "4.0.4"
mode = "comment"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# phpcs 4.x exits 3 on findings; without this qlty treats that as a hard error
# and drops every finding instead of reporting them.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# The Symfony components are held on the 7.x line because 3.90+ otherwise
# resolves Symfony 8, which requires PHP 8.4.1 and uses syntax the PHP 8.3
# runner cannot parse. These pins only take effect without a package_file.
[[plugin]]
name = "php-cs-fixer"
version = "3.95.25"
extra_packages = [
    "sinemacula/coding-standards@1.24.1",
    "symfony/console@^7.4",
    "symfony/event-dispatcher@^7.4",
    "symfony/filesystem@^7.4",
    "symfony/finder@^7.4",
    "symfony/options-resolver@^7.4",
    "symfony/process@^7.4",
    "symfony/stopwatch@^7.4",
    "symfony/string@^7.4",
]

[[plugin]]
name = "phpstan"
version = "2.1.46"
package_file = "composer.json"

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

# Skip radarlint smell analysis on the test tree — reused fixture literals and
# multi-branch data providers trip duplication/return-count rules without value.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["tests/**"]
